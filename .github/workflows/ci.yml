name: CI

# The server and the add-on have no dependencies, so there is nothing to
# install and the whole job is a checkout. That is the point of building them
# this way, and it would be a shame to lose it to a convenience in the workflow.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the server
        run: python -m unittest discover -s tests -v

      - name: The add-on must compile without Blender present
        # `bpy` is only importable inside Blender, so this checks syntax and
        # nothing else. A file that fails here fails for everybody at load,
        # which is the one failure a user cannot work around.
        run: |
          python -m py_compile addon/aurum_blender_mcp/__init__.py
          python -m py_compile addon/aurum_blender_mcp/bridge.py
          python -m py_compile addon/aurum_blender_mcp/commands.py
          python -m py_compile headless.py
          python -m py_compile parts/mech_kit.py
          python -m py_compile parts/mechs.py
          python -m py_compile parts/props.py
          python -m py_compile parts/preview.py
          python -m py_compile parts/build.py

      - name: Nothing may import outside the standard library
        shell: bash
        run: |
          # The whole reason this pair installs anywhere is that it needs
          # nothing. A stray third-party import would not fail here; it would
          # fail on somebody else's machine, which is much worse.
          if grep -rnE '^\s*(import|from)\s+(numpy|requests|mcp|pydantic|bpy_extras|setuptools)' \
               --include='*.py' addon server parts headless.py; then
            echo "a third-party import appeared; the standard library only is a promise"
            exit 1
          fi
